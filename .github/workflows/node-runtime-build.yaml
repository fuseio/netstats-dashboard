name: Node runtime build
on:
  pull_request:
    paths:
      - '**/Dockerfile*'
      - Dockerfile*
      - package.json
      - .github/workflows/node-runtime-build.yaml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: node-runtime-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - dockerfile: Dockerfile
            node-version: 22.23.4
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v3
      - name: Build and verify runtime
        run: |
          docker buildx build --pull --load --tag runtime-security-check --file "${{ matrix.dockerfile }}" .
          docker run --rm --entrypoint node runtime-security-check --version
          docker run --rm --entrypoint node runtime-security-check -e 'if (process.version !== "v${{ matrix.node-version }}") process.exit(1)'
